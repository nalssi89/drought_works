name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test:unit
      - run: npm run build

  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: >-
          deno check
          --config supabase/functions/kma-hourly-cache/deno.json
          supabase/functions/kma-hourly-cache/index.ts
          supabase/functions/kma-hourly-cache/daily-rollover.ts
          supabase/functions/kma-hourly-cache/official-refresh.ts
